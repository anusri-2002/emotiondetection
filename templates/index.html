<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Emotion Detector</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4f46e5,#9333ea);
            padding:20px;
        }

        .container{
            background:#fff;
            width:100%;
            max-width:500px;
            padding:35px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 15px 35px rgba(0,0,0,0.2);
        }

        h2{
            color:#222;
            margin-bottom:10px;
            font-size:32px;
        }

        .subtitle{
            color:#666;
            margin-bottom:25px;
        }

        .file-input-wrapper{
            margin-bottom:20px;
        }

        input[type="file"]{
            width:100%;
            padding:12px;
            border:2px dashed #7c3aed;
            border-radius:12px;
            background:#f7f5ff;
            cursor:pointer;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#7c3aed;
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#6d28d9;
        }

        .result-card{
            margin-top:25px;
        }

        .result-card hr{
            margin-bottom:20px;
            border:none;
            height:1px;
            background:#ddd;
        }

        .emotion-text{
            font-size:30px;
            color:#7c3aed;
            margin:15px 0;
            font-weight:700;
        }

        .image-preview{
            margin-top:20px;
        }

        .image-preview img{
            width:100%;
            max-height:350px;
            object-fit:cover;
            border-radius:15px;
            border:3px solid #7c3aed;
        }

        .reset-btn{
            display:inline-block;
            margin-top:20px;
            padding:12px 24px;
            background:#22c55e;
            color:white;
            text-decoration:none;
            border-radius:10px;
            font-weight:600;
            transition:0.3s;
        }

        .reset-btn:hover{
            background:#16a34a;
        }

        @media(max-width:600px){
            .container{
                padding:25px;
            }

            h2{
                font-size:26px;
            }

            .emotion-text{
                font-size:24px;
            }
        }
    </style>

</head>
<body>

    <div class="container">
        <h2>😊 Emotion Detector</h2>
        <p class="subtitle">Upload a face image to detect emotions</p>

        <form method="POST" enctype="multipart/form-data">
            <div class="file-input-wrapper">
                <input type="file" name="image" id="file" required>
            </div>

            <button type="submit">Analyze Emotion</button>
        </form>

        {% if prediction %}
        <div class="result-card">
            <hr>

            <p>Analysis Result</p>

            <h3 class="emotion-text">
                {{ prediction }}
            </h3>

            <div class="image-preview">
                <img src="{{ image_path }}" alt="Uploaded Image">
            </div>

            <a href="/" class="reset-btn">
                Try Another Image
            </a>
        </div>
        {% endif %}

    </div>

</body>
</html>
